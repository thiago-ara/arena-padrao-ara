<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a2a72">
<title>Arena ARA · Padrão ARA</title>
<style>
:root{--line:#2d5cc4;--txt:#f5f8ff;--muted:#c0d2f2;--yellow:#f5c518;--gold2:#ffdd55;--green:#22c55e;--red:#ff6b5b;--silver:#d4dce8;--bronze:#e0995e;--navy:#0a2a72}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 80% -10%,#2a62d6 0,transparent 55%),linear-gradient(180deg,#0b2e7c,#071d52);color:var(--txt);font:16px/1.45 'Segoe UI',Arial,sans-serif;overflow:hidden}
h1,h2,.gname,.lvv,.ovv,.big,.score,.bigstars,.won .p,.fstats b,.rkpos b{font-family:'Bahnschrift','Segoe UI Semibold','Arial Narrow',Arial,sans-serif}
button{font:inherit;font-weight:700;cursor:pointer;border:2px solid #4a78d8;background:#143f9e;color:var(--txt);border-radius:12px;padding:10px 16px;min-height:44px;touch-action:manipulation;user-select:none}
button:hover{border-color:var(--gold2);background:#1b4cb8}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.primary{background:linear-gradient(180deg,#ffd84a,#e6b400);border-color:#f5c518;color:var(--navy);box-shadow:0 3px 0 #a07c00}
.primary:hover{background:linear-gradient(180deg,#ffe57a,#f5c518);color:var(--navy)}
.ghost{background:transparent;border-color:#4a78d8}
.danger{border-color:#ff8f82;color:#ffd1cb}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px clamp(12px,2.5vw,28px);background:#071d52;border-bottom:3px solid var(--yellow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(18px,2vw,24px);background:none;border:none;padding:0;min-height:0;font-family:'Bahnschrift',Arial,sans-serif}
.brand:hover{background:none}.brand .logo{border:3px solid var(--yellow);color:var(--yellow);border-radius:11px;padding:1px 9px}.brand b{color:var(--yellow)}
.hr{display:flex;gap:8px;align-items:center}
.hb{display:flex;align-items:center;gap:6px;font-size:14px;padding:6px 12px;min-height:40px;background:#0e3488}
.hb svg{width:20px;height:20px}
.pchip{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 12px 4px 4px;min-height:40px;background:#0e3488;border-color:var(--yellow)}
.pchip .av{width:30px;height:30px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:900}
.pchip small{display:block;font-size:11px;color:var(--muted);font-weight:600;line-height:1}
main{overflow:auto;padding:clamp(12px,2vw,26px) clamp(12px,2.5vw,28px);display:flex;flex-direction:column;min-height:0}
footer{text-align:center;font-size:12px;color:var(--muted);padding:5px;border-top:1px solid var(--line);background:#071d52}footer b{color:var(--yellow)}
h1{font-size:clamp(26px,3.4vw,44px);line-height:1.1;margin:0;font-weight:800}h1 span{color:var(--yellow)}
h2{margin:0;font-size:clamp(22px,2.4vw,32px)}
h3{margin:0 0 8px;font-size:13px;letter-spacing:1.2px;color:var(--yellow)}
.dim{color:var(--muted)}.eyebrow{color:var(--yellow);font-size:12px;letter-spacing:2px;font-weight:800;margin:0 0 6px}
.box{background:linear-gradient(180deg,#113a96,#0d3184);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,1.8vw,22px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ico{display:inline-grid;place-items:center;border-radius:50%;background:#fff;border:4px solid var(--c);flex:0 0 auto}.ico svg{width:62%;height:62%}
.hidden{display:none!important}
.deco{position:absolute;pointer-events:none}
.scene-agri{background:linear-gradient(#7cc3ef 0,#d4effc 50%,#8bb84e 50%,#5d8a2f 100%)}
.scene-agri .d1{right:6%;top:8%;width:62px;height:62px;border-radius:50%;background:#ffd84a;box-shadow:0 0 34px #ffd84a}
.scene-agri .d2{left:0;right:0;bottom:0;height:50%;background:repeating-linear-gradient(90deg,transparent 0 7%,#4a7a22 7% 8.2%)}
.scene-agri .d3{left:0;right:0;top:45%;height:9%;background:radial-gradient(circle at 12px 50%,#3f8f2a 11px,transparent 12px) 0 0/30px 100% repeat-x}
.scene-agri .d4{left:0;right:0;top:44%;height:3px;background:#7a4a1d}
.scene-textil{background:linear-gradient(#2b5480 0,#36689a 55%,#6d7d8e 55%,#56636f 100%)}
.scene-textil .d1{left:0;right:0;top:6%;height:22%;background:repeating-linear-gradient(90deg,transparent 0 3%,#a9d4f5 3% 11%,transparent 11% 14%);opacity:.3}
.scene-textil .d2{left:0;right:0;top:55%;height:4px;background:#f5c51870}
.scene-textil .d3{left:0;right:0;bottom:0;height:45%;background:repeating-linear-gradient(90deg,transparent 0 9.6%,#ffffff12 9.6% 10%)}
.scene-imob{background:linear-gradient(#22439a 0,#7d50d6 55%,#f4a53a 100%)}
.scene-imob .d1{left:0;right:0;bottom:12%;height:36%;background:#0f172a;opacity:.45;clip-path:polygon(0 70%,6% 70%,6% 40%,12% 40%,12% 60%,20% 60%,20% 25%,26% 25%,26% 55%,40% 55%,40% 35%,46% 35%,46% 60%,70% 60%,70% 30%,76% 30%,76% 50%,84% 50%,84% 15%,90% 15%,90% 60%,100% 60%,100% 100%,0 100%)}
.scene-imob .d2{left:0;right:0;bottom:0;height:12%;background:#4a3a2c;border-top:4px solid #2b2017}
.scene-imob .d3{right:6%;bottom:12%;width:6px;height:72%;background:#f59e0b}
.scene-imob .d4{right:6%;top:16%;width:34%;height:6px;background:#f59e0b}
.scene-energia{background:linear-gradient(#2f6fd1 0,#86c2f2 55%,#4f7f33 55%,#36591f 100%)}
.scene-energia .d1{left:6%;top:8%;width:56px;height:56px;border-radius:50%;background:#ffd84a;box-shadow:0 0 30px #ffd84a}
.scene-energia .d2{left:0;bottom:0;width:16%;height:50%;background:linear-gradient(90deg,#64748b,#475569);border-right:4px solid #334155}
.scene-energia .d3{right:0;bottom:45%;width:30%;height:16%;background:#0f2a5a;opacity:.6;clip-path:polygon(0 100%,0 50%,10% 50%,10% 20%,20% 20%,20% 60%,35% 60%,35% 0,45% 0,45% 40%,60% 40%,60% 25%,75% 25%,75% 55%,90% 55%,90% 30%,100% 30%,100% 100%)}
.scene-energia .d4{left:0;right:0;top:30%;height:2px;background:#0f172a55}
.hubwrap{margin:auto 0;padding-bottom:3vh}
.hubhead{text-align:center;margin:6px 0 20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.6vw,22px);max-width:1300px;width:100%;margin:0 auto}
.card{position:relative;text-align:left;display:flex;flex-direction:column;padding:0;border-radius:22px;overflow:hidden;background:#0d3184;border:3px solid var(--yellow)}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 30px #0008;background:#0d3184}
.thumb{position:relative;height:clamp(130px,17vh,190px);display:grid;place-items:center;overflow:hidden}
.thumb .ico{width:clamp(70px,7vw,96px);height:clamp(70px,7vw,96px);position:relative;z-index:2;box-shadow:0 6px 20px #0006}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb small{font-size:12px;letter-spacing:1.5px;color:var(--gold2);font-weight:900}
.gname{font-size:clamp(22px,2vw,28px);font-weight:800;line-height:1.1}
.go{margin-top:auto;align-self:stretch;text-align:center;background:var(--yellow);color:var(--navy);border-radius:12px;padding:10px;font-weight:900;font-size:17px}
.cprog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.mdots{display:flex;gap:3px}.mdots i{width:10px;height:10px;border-radius:50%;background:#ffffff30}.mdots i.on{background:var(--pc,var(--yellow))}
.mine{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:22px auto 0;font-size:15px;color:var(--muted)}
.trailtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1100px;width:100%;margin:0 auto}
.trailtop .tt{display:flex;align-items:center;gap:12px;flex:1}
.trailtop .ico{width:62px;height:62px}
.trailtop small{font-size:12px;letter-spacing:1.5px;color:var(--gold2);font-weight:900}
.trail{position:relative;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:1100px;width:100%;margin:28px auto 22px}
.trail::before{content:'';position:absolute;left:5%;right:5%;top:26px;height:4px;background:#ffffff26;border-radius:2px}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:0;min-height:0}
.node:hover{background:none}
.node .c{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;background:#163f94;border:3px solid #4a78d8;color:var(--muted)}
.node .c svg{width:20px;height:20px}
.node.done .c{background:var(--pc);border-color:#fff;color:var(--navy)}
.node.cur .c{background:var(--yellow);border-color:#fff;color:var(--navy);animation:pulse 1.4s infinite}
.node.sel .c{box-shadow:0 0 0 5px #ffffffaa}
.node .s{font-size:12px;color:var(--yellow);letter-spacing:1px;min-height:16px}
.node .vn{font-size:12px;font-weight:800;color:#fff;text-align:center;line-height:1.1;max-width:100px}
.node.done .vn{color:var(--pc)}.node.cur .vn{color:var(--yellow)}
@keyframes pulse{50%{box-shadow:0 0 0 9px #f5c51840}}
.lvcard{max-width:760px;width:100%;margin:0 auto;text-align:center;border-top:6px solid var(--pc);padding:26px clamp(18px,3vw,40px)}
.lvcard small{font-size:13px;letter-spacing:2px;color:var(--pc);font-weight:900}
.lvv{font-size:clamp(34px,4.4vw,56px);font-weight:800;line-height:1.05;margin:8px 0 10px}
.quote{font-style:italic;color:#e3ecfb;font-size:clamp(16px,1.5vw,19px);margin:0 0 18px}
.bigplay{font-size:22px;padding:14px 46px;min-height:58px;border-radius:16px}
.lvmeta{margin-top:12px;font-size:14px;color:var(--muted)}
.howv{margin:0 auto 18px;max-width:620px;text-align:left;background:#071d52;border:2px solid var(--pc);border-radius:14px;padding:12px 16px}
.hvt{font-size:12px;letter-spacing:1.5px;font-weight:900;color:var(--pc)}
.howv p{margin:4px 0 8px;font-size:16px}.hvg{font-size:14px;color:var(--muted);margin-top:4px}.hvg b{color:#fff}
.vstrip{max-width:1300px;width:100%;margin:-6px auto 18px;text-align:center}
.vsh{font-size:clamp(15px,1.4vw,18px);margin-bottom:8px}.vsh b{color:var(--yellow)}
.vlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.vi{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 10px 4px 4px;border-radius:999px;background:#0e3488;border:2px solid var(--pc);color:#fff}
.vi i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--pc);color:var(--navy);display:grid;place-items:center;font-size:12px}
.vi.on{background:var(--pc);color:var(--navy)}.vi.on i{background:#fff}
/* JOGO */
.play{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ib{width:46px;height:46px;padding:0;font-size:20px;display:grid;place-items:center;flex:0 0 auto}
.hud .lvl{display:flex;flex-direction:column;line-height:1.15;min-width:160px}
.hud .lvl small{font-size:11px;letter-spacing:1.5px;color:var(--pc);font-weight:900}.hud .lvl b{font-size:19px}
.timebar{flex:1;min-width:100px;height:14px;background:#ffffff1f;border-radius:8px;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--yellow),var(--gold2))}.timebar.hurry i{background:var(--red)}
.chip{background:#0e3488;border:1px solid var(--line);border-radius:10px;padding:3px 12px;text-align:center;min-width:78px}
.chip small{display:block;font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:800}.chip b{font-size:20px}.chip.y{border-color:var(--yellow)}.chip.y b{color:var(--yellow)}
.field{position:relative;flex:1;min-height:400px;border-radius:18px;overflow:hidden;border:3px solid var(--yellow);user-select:none}
.hintline{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(15px,1.5vw,19px);font-weight:700;text-align:center;min-height:30px}
.vpill{background:var(--pc);color:var(--navy);border-radius:999px;padding:3px 12px;font-weight:900;font-size:14px;white-space:nowrap}
.vseal{position:absolute;left:12px;top:12px;z-index:20;max-width:40%;display:flex;align-items:center;gap:10px;background:#071d52ee;border:3px solid var(--pc);border-radius:14px;padding:6px 14px 6px 6px;box-shadow:0 6px 18px #0006}
.vseal .vsn{width:38px;height:38px;border-radius:50%;background:var(--pc);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:20px;flex:0 0 auto}
.vseal small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:800}.vseal b{font-size:clamp(14px,1.4vw,18px);color:var(--pc)}
.ent{position:absolute;transform:translate(-50%,-50%);z-index:5}
button.ent{border:none;background:none;padding:0;min-height:0}
button.ent:hover{background:none}
.stn{display:flex;flex-direction:column;align-items:center;gap:4px;width:clamp(96px,11vw,150px);padding:10px 6px 8px!important;background:#fffffff2!important;border:4px solid #fff!important;border-radius:18px!important;color:var(--navy);font-size:clamp(12px,1.1vw,15px);line-height:1.15;text-align:center;box-shadow:0 6px 18px #0005;transition:transform .15s,background .15s}
.stn svg{width:clamp(40px,4vw,56px);height:clamp(40px,4vw,56px)}
.stn:hover{transform:translate(-50%,-50%) scale(1.04)}
.stn.lit{background:var(--yellow)!important;transform:translate(-50%,-50%) scale(1.1)}
.stn.hint{border-color:var(--yellow)!important;animation:hp .8s infinite}
.stn.passive{cursor:default;opacity:.92}
.stn .kn{position:absolute;top:4px;left:8px;font-size:11px;color:#55708a}
.stn.passive .kn{display:none}
.stn.alert{background:#ffe1dc!important;border-color:#ff6b5b!important}
@keyframes hp{50%{box-shadow:0 0 0 8px #f5c51870}}
.bump{animation:bump .25s}@keyframes bump{50%{transform:translate(-50%,-50%) scale(1.12)}}
.need{width:80%;height:10px;background:#cbd5e1;border-radius:6px;overflow:hidden}.need i{display:block;height:100%;background:#22c55e;transition:width .2s}
.stn.low .need i{background:#ff6b5b}.stn.lowest{border-color:var(--yellow)!important}
.panel{background:#0a2a72ee;border:2px solid #ffffff50;border-radius:16px;padding:10px 18px;text-align:center;color:#fff;box-shadow:0 8px 24px #0006}
.panel svg{display:block;margin:0 auto 4px}
.panel small{font-size:11px;letter-spacing:1.5px;color:var(--gold2);font-weight:900}
.big{font-size:clamp(28px,3.2vw,42px);font-weight:800;color:var(--yellow);line-height:1.05}
.mentor{display:flex;align-items:center;gap:10px;background:#0a2a72ee;border:2px solid #fff6;border-radius:999px;padding:6px 16px;font-weight:800;white-space:nowrap}
.mentor .av{width:38px;height:38px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:900}
.dots2{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots2 i{width:14px;height:14px;border-radius:50%;background:#fff5}.dots2 i.on{background:var(--yellow)}
.belt{position:absolute;left:4%;right:12%;top:38%;height:14%;border-radius:14px;background:repeating-linear-gradient(90deg,#2b3946 0 26px,#3a4b5c 26px 52px);border:4px solid #1e293b;animation:belt 1s linear infinite;z-index:2}
@keyframes belt{to{background-position:-52px 0}}
.itm{width:clamp(56px,5.6vw,76px);height:clamp(56px,5.6vw,76px);transition:transform .15s}
.itm svg{width:100%;height:100%;filter:drop-shadow(0 3px 3px #0006)}
.itm:hover{transform:translate(-50%,-50%) scale(1.08)}
.def{position:absolute;left:24%;top:30%;width:48%;height:44%;border-radius:45% 55% 50% 40%;background:radial-gradient(circle at 40% 40%,#7c2d12,#451a03);opacity:.9;pointer-events:none}
.def::after{content:'';position:absolute;left:-30%;top:40%;width:160%;height:3px;background:#451a03;transform:rotate(-30deg)}
.spot{position:absolute;width:clamp(76px,7vw,100px);height:clamp(76px,7vw,100px);border-radius:50%;background:#00000030;border:3px dashed #ffffff55;transform:translate(-50%,-50%);z-index:1}
.pop{width:clamp(70px,6.4vw,92px);height:clamp(70px,6.4vw,92px);border-radius:50%;background:#fff;border:5px solid #22c55e;display:grid;place-items:center;animation:popin .15s}
.pop svg{width:70%;height:70%}.pop.badp{border-color:#ff6b5b}
@keyframes popin{from{transform:translate(-50%,-50%) scale(.3)}}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;width:clamp(150px,18vw,220px);padding:12px!important;background:#fffffff2!important;border:4px solid #fff!important;border-radius:18px!important;color:var(--navy);box-shadow:0 6px 18px #0005}
.slot svg{width:44px;height:44px}.slot .big{color:var(--navy);font-size:26px}.slot small{font-size:12px;color:#55708a}
.slot .dl{width:100%;height:12px;background:#cbd5e1;border-radius:6px;overflow:hidden}.slot .dl i{display:block;height:100%;background:#22c55e}
.slot.urgent{border-color:#ff6b5b!important}.slot.urgent .dl i{background:#ff6b5b}.slot.empty{opacity:.35}
.truck{width:min(460px,46%)}.truck .cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:8px 0 4px}
.truck .cells i{height:34px;border-radius:5px;background:#ffffff22;border:2px dashed #ffffff55}.truck .cells i.f{background:var(--yellow);border:2px solid #0a2a72}
.piece{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 14px!important;background:#fff!important;border:4px solid #fff!important;border-radius:16px!important;color:var(--navy);min-width:110px;box-shadow:0 6px 18px #0005}
.piece .blk{display:flex;gap:3px}.piece .blk i{width:16px;height:24px;background:var(--yellow);border:2px solid #0a2a72;border-radius:3px}
.scrap{width:62px;height:62px;border-radius:50%;background:#ffffffee;border:4px solid var(--yellow);padding:8px;animation:wob .7s infinite alternate}.scrap svg{width:100%;height:100%}
@keyframes wob{to{transform:translate(-50%,-50%) scale(1.12)}}
.mate{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:14px;color:#fff;text-shadow:0 1px 3px #000}
.mate .avt{width:clamp(64px,6vw,84px);height:clamp(64px,6vw,84px);border-radius:50%;background:#fff;border:4px solid var(--c);display:grid;place-items:center}.mate .avt svg{width:70%;height:70%}
.mate.ask .avt{box-shadow:0 0 0 6px #f5c518aa}
.task{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:4px solid var(--yellow);border-radius:18px;padding:10px 12px;box-shadow:0 8px 20px #0006}
.task .tic{position:relative;width:62px;height:62px}.task .tic svg{width:100%;height:100%}
.task .tb2{width:100%;height:6px;background:#cbd5e1;border-radius:4px;overflow:hidden}.task .tb2 i{display:block;height:100%;background:var(--yellow)}
.rb{display:flex;gap:10px;justify-content:center}
.rbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:92px;min-height:58px;border-radius:16px;font-size:20px;line-height:1;color:#fff;border:3px solid #fff;box-shadow:0 4px 0 #0004}
.rbtn small{font-size:13px;margin-top:4px}
.rbtn.ok{background:#16a34a}.rbtn.ok:hover{background:#22c55e}.rbtn.or{background:#1d4ed8}.rbtn.or:hover{background:#2563eb}
/* CONFIANÇA: pedido do colega */
.req{background:#fff;color:var(--navy);border-radius:18px;padding:10px 16px;border:4px solid var(--yellow);box-shadow:0 8px 22px #0006;text-align:center;min-width:240px}
.req small{font-size:12px;font-weight:800;color:#55708a}.req .rq{display:flex;align-items:center;gap:10px;justify-content:center;font-size:clamp(18px,2vw,24px);font-weight:900}.req .rq svg{width:46px;height:46px}
.req .tbar{height:8px;border-radius:5px;background:#cbd5e1;overflow:hidden;margin-top:6px}.req .tbar i{display:block;height:100%;background:var(--yellow)}

/* ===== Medidor do valor: uma forma diferente por nível ===== */
function vmeter(i,st,M){
 const t=st.hits+st.misses,acc=t?st.hits/t:1,pr=Math.min(1,st.prog/M.goal),pct=Math.round(acc*100);
 switch(i){
 case 0:{const ok=st.misses<=2;return `<small>CORRENTE DE CONFIANÇA</small><div class="vmchain">${Array(M.goal).fill(0).map((_,k)=>`<i class="${k<st.prog?'on':''}"></i>`).join('')}${Array(Math.min(4,st.misses)).fill('<i class="x"></i>').join('')}</div><b>${st.prog} elos fortes · ${ok?'a equipe confia em você':'confiança abalada'}</b>`}
 case 1:return `<small>CADERNO DE LIÇÕES</small><div class="vmbook">${Array(Math.max(4,Math.min(8,st.misses))).fill(0).map((_,k)=>`<i class="${k<st.misses?'on':''}">${k<st.misses?'✎':''}</i>`).join('')}</div><b>${st.misses} ${st.misses===1?'erro virou lição':'erros viraram lição'} · ${st.prog}/${M.goal} acertos</b>`;

function stepOf(i,st,M){const n=3,a=st.hits+st.misses;
 if(i===3)return st.prog>=1?2:st.steps>0?1:0;
 if(i===8)return Math.min(n-1,Math.floor(st.prog/4));
 if(i===5)return Math.min(n-1,st.hits>=3?2:st.hits>=1?1:0);

const KEY='arena-ara-v8';
let save={players:{},current:null,event:false,device:'',history:[]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.players)save=Object.assign(save,s)}catch(e){}
if(!Array.isArray(save.history))save.history=[];
for(const id in save.players){const pl=save.players[id];if(!pl||typeof pl.name!=='string'){delete save.players[id];continue}pl.prog=pl.prog||{};ORDER.forEach(b=>pl.prog[b]=pl.prog[b]||{})}
if(save.current&&!save.players[save.current])save.current=null;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const P=()=>save.players[save.current]||null;
const prog=(b,pl=P())=>pl?pl.prog[b]:{};
const passed=(b,i,pl=P())=>!!(prog(b,pl)[i]&&prog(b,pl)[i].stars>0);
const unlocked=(b,i,pl=P())=>save.event||i===0||passed(b,i-1,pl);
const doneCount=(b,pl=P())=>PILLARS.filter((_,i)=>passed(b,i,pl)).length;
const starCount=(b,pl=P())=>PILLARS.reduce((s,_,i)=>s+((prog(b,pl)[i]||{}).stars||0),0);
const nextLevel=(b,pl=P())=>{for(let i=0;i<10;i++)if(!passed(b,i,pl))return i;return 9};
const pillarAny=(i,pl=P())=>!!pl&&ORDER.some(b=>passed(b,i,pl));
function statsOf(pl,b){let score=0,pillars=0,stars=0;for(const k of b?[b]:ORDER)for(let i=0;i<10;i++){const r=pl.prog[k][i];if(r&&r.stars>0){score+=r.score||0;stars+=r.stars;pillars++}}return{score,pillars,stars}}
function ranking(b){return Object.entries(save.players).map(([id,pl])=>({id,pl,...statsOf(pl,b)})).filter(r=>r.pillars>0).sort((x,y)=>y.score-x.score||y.pillars-x.pillars||y.stars-x.stars||x.pl.created-y.pl.created)}
function posOf(id,b){const r=ranking(b),k=r.findIndex(x=>x.id===id);return{pos:k<0?null:k+1,total:r.length,list:r}}
function findByName(n){n=n.trim().toLocaleLowerCase('pt-BR');return Object.keys(save.players).find(id=>save.players[id].name.toLocaleLowerCase('pt-BR')===n)}
function createPlayer(name){const ex=findByName(name);if(ex)return ex;const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const pr={};ORDER.forEach(b=>pr[b]={});save.players[id]={name:name.trim(),prog:pr,created:Date.now(),last:Date.now()};return id}

let sound=true,actx=null;
function ctx(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state!=='running')actx.resume()}catch(e){}return actx}
function tone(f,d=.1,type='sine',v=.05,w=0){if(!sound)return;const a=ctx();if(!a)return;const t=a.currentTime+w,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const sfx={ok(n){const f=520*Math.pow(2,Math.min(n,12)/12);tone(f,.09,'triangle',.06);tone(f*1.5,.1,'sine',.04,.06)},bad(){tone(196,.18,'triangle',.06);tone(147,.2,'triangle',.05,.08)},bonus(){[660,880,1100,1320].forEach((f,k)=>tone(f,.1,'triangle',.05,k*.07))},win(){[523,659,784,1046,1318].forEach((f,k)=>tone(f,.18,'triangle',.06,k*.12))},lose(){[392,330,262].forEach((f,k)=>tone(f,.2,'triangle',.05,k*.15))},fanfare(){[523,523,784,659,784,1046,1318,1568].forEach((f,k)=>tone(f,.22,'triangle',.06,k*.14))},blip(k){tone([392,494,587,698][k%4],.25,'triangle',.06)},step(){tone(660,.04,'square',.015)}};
const music={t:null,step:0,fast:false,start(root){this.stop();this.step=0;this.fast=false;const pat=[0,4,7,12,7,4,9,7];const tick=()=>{if(sound&&ctx()){const s=this.step;if(s%8===0)tone(root/2,.35,'sine',.04);tone(root*Math.pow(2,(pat[s%8]+(Math.floor(s/16)%2?2:0))/12),.14,'triangle',.018)}this.step++;this.t=setTimeout(tick,this.fast?165:215)};tick()},stop(){clearTimeout(this.t);this.t=null}};

function trail(b,sel){

/* 4 · FOCO NO BÁSICO — Labirinto do Básico */
MODS[3]=R=>{const{B,rng,F,st}=R;const W=13,H=7;let grid,me,goal,startP,obst,shortc,trailSet,stun=0,simpleSet,mazes=0,steps=0;
 const mz=document.createElement('div');mz.className='maze';mz.style.cssText=`grid-template-columns:repeat(${W},1fr);grid-template-rows:repeat(${H},1fr);--ar:${W}/${H}`;F.appendChild(mz);
 const key=(x,y)=>y*W+x;
 function gen(){
  grid=Array(W*H).fill(0);obst=new Set();shortc=new Set();trailSet=new Set();
  const sy=rng.int(1,H-2),gy=rng.int(1,H-2);let x=0,y=sy;simpleSet=new Set([key(x,y)]);grid[key(x,y)]=1;
  const turns=new Set([rng.int(2,4),rng.int(6,9)]);
  while(x<W-1){x++;grid[key(x,y)]=1;simpleSet.add(key(x,y));
   const target=turns.has(x)?(x>5?gy:rng.int(1,H-2)):null;
   if(target!==null)while(y!==target){y+=target>y?1:-1;grid[key(x,y)]=1;simpleSet.add(key(x,y))}}
  while(y!==gy){y+=gy>y?1:-1;grid[key(x,y)]=1;simpleSet.add(key(x,y))}
  startP=[0,sy];goal=[W-1,y];
  // atalhos complicados: caminhos tortuosos com obstáculos que saem do caminho simples
  const branches=rng.shuffle([...simpleSet].map(k=>[k%W,Math.floor(k/W)]).filter(([bx])=>bx>=1&&bx<=W-4)).slice(0,4);
  branches.forEach(([bx,by],n)=>{let cx=bx,cy=by,len=rng.int(6,11),first=true,dy=rng()<.5?-1:1,placed=0;
   for(let s=0;s<len;s++){const opts=[[cx,cy+dy],[cx+1,cy],[cx,cy+dy],[cx-1,cy]];let mv=null;
    for(const o of rng.shuffle(opts)){const[nx,ny]=o;if(nx>=0&&ny>=0&&nx<W&&ny<H&&!simpleSet.has(key(nx,ny))){mv=o;break}}
    if(!mv){dy=-dy;continue}[cx,cy]=mv;grid[key(cx,cy)]=1;
    if(first){shortc.add(key(cx,cy));first=false}else if(placed<2&&rng()<.45){obst.add(key(cx,cy));placed++}}});
  me=[...startP];steps=0;st.steps=0;st.ideal=simpleSet.size-1;render()}
 function adj(x,y){return Math.abs(x-me[0])+Math.abs(y-me[1])===1&&grid[key(x,y)]===1}
 function render(){let h='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=key(x,y),open=grid[k]===1,isMe=me[0]===x&&me[1]===y,isGoal=goal[0]===x&&goal[1]===y;
  let cls=!open?'w':isGoal?'goal':obst.has(k)?'ob':trailSet.has(k)?'vis':shortc.has(k)?'short':'o';if(open&&!isGoal&&adj(x,y))cls+=' adj';
  h+=`<button class="mc ${cls}" data-x="${x}" data-y="${y}" ${open?'':'tabindex="-1" aria-hidden="true"'}>${isGoal?ic(B.goalIc):obst.has(k)?IC.cone:''}${shortc.has(k)&&!isMe?'<span class="lbl">ATALHO?</span>':''}${isMe?`<span class="me${stun>0?' stun':''}">${IC.climber}</span>`:''}</button>`}
  mz.innerHTML=h}
 function move(x,y){if(stun>0||!adj(x,y))return;trailSet.add(key(...me));me=[x,y];steps++;st.steps=steps;sfx.step();const k=key(x,y);
  if(obst.has(k)){stun=1.2;R.bad('o atalho complicou: obstáculo no caminho.','maze',50,40)}
  if(x===goal[0]&&y===goal[1]){mazes++;R.progress();const ideal=st.ideal;if(steps<=ideal+1){st.simple++;R.good(25,'Saída pelo caminho simples!',85,50)}else R.good(10,'Saiu, mas pelo caminho longo.',85,50);gen();return}
  render()}
 mz.onclick=e=>{const c=e.target.closest('.mc');if(c&&R.on)move(+c.dataset.x,+c.dataset.y)};
 function bfs(){const prev=new Map([[key(...me),null]]),q=[me];while(q.length){const[x,y]=q.shift();if(x===goal[0]&&y===goal[1])break;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(nx<0||ny<0||nx>=W||ny>=H||grid[k]!==1||obst.has(k)||prev.has(k))continue;prev.set(k,[x,y]);q.push([nx,ny])}}
  let c=goal,path=[];while(c&&!(c[0]===me[0]&&c[1]===me[1])){path.unshift(c);c=prev.get(key(...c))}return path[0]}
 gen();
 return{tick(dt){if(stun>0){stun-=dt;if(stun<=0){stun=0;render()}}},
  key(e){const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){move(me[0]+d[0],me[1]+d[1]);return true}},
  botEvery:.12,bot(){const n=bfs();if(n)move(...n)},summary:()=>[['Saídas alcançadas',mazes],['Pelo caminho simples',st.simple]]}};

MODS[5]=R=>{const{B,rng,F}=R;const P9=[];[32,56,80].forEach(y=>[28,50,72].forEach(x=>P9.push([x,y])));const cells=Array(9).fill(null);let sp=.3,good=0,badT=0;

 prio:'Produza primeiro o pedido de prazo mais curto.',late:'Não deixe a barra de prazo zerar.',fit:'Veja quanto falta antes de escolher a carga.',waste:'Recolha as sobras antes que se percam.',
 fall:'Observe o círculo vermelho e troque de lado antes da pedra chegar. E se cair, continue!',fb:'Trabalho bom merece elogio; defeito pede orientação.',none:'Dê retorno a todos os colegas.'};
function confetti(n=70){const cols=['#f5c518','#ffdd55','#1d4ed8','#fff','#3b82f6'];for(let k=0;k<n;k++){const e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=rnd(cols);e.style.animationDuration=(1.6+Math.random()*1.6)+'s';e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}
function result(b,i,st,sm,left,seed){
 const B=BIZ[b],M=MECH[i],p=PILLARS[i],pl=P(),id=save.current,t=st.hits+st.misses,acc=t?st.hits/t:0;
 let ok=M.pass==='score'?st.score>=M.goal:st.prog>=M.goal;
 if(M.pass==='acc')ok=ok&&acc>=.8;if(M.pass==='late')ok=ok&&st.late<=2;if(M.pass==='waste')ok=ok&&st.waste<=3;
 const qual=i===8?(st.falls<=1?1:st.falls<=3?.8:.6):i===3?(st.simple/Math.max(1,st.prog)):acc;
 const score=Math.round(st.score),stars=ok?1+(qual>=.75?1:0)+(qual>=.9?1:0):0;
 const before={all:posOf(id).pos,bd:doneCount(b)===10,ad:statsOf(pl).pillars===40};
 const prev=prog(b)[i]||{};pl.prog[b][i]={stars:Math.max(stars,prev.stars||0),score:ok?Math.max(score,prev.score||0):(prev.score||0),tryBest:ok?(prev.tryBest||0):Math.max(score,prev.tryBest||0)};
 pl.last=Date.now();save.history.push({name:pl.name,b,i,score,stars,ok,seed,at:Date.now()});if(save.history.length>300)save.history=save.history.slice(-300);persist();
 const after={biz:posOf(id,b),all:posOf(id),bd:doneCount(b)===10,ad:statsOf(pl).pillars===40},newBiz=after.bd&&!before.bd,newAll=after.ad&&!before.ad;
 const why=[];if(M.pass==='score'){if(score<M.goal)why.push(`faltaram ${M.goal-score} pontos`)}else{if(st.prog<M.goal)why.push(i===8?`faltaram ${M.goal-st.prog} passos para o topo`:`faltaram ${M.goal-st.prog} para a meta`);if(M.pass==='acc'&&acc<.8)why.push(`precisão de ${Math.round(acc*100)}% (meta 80%)`);if(M.pass==='late'&&st.late>2)why.push(`${st.late} atrasos (máximo 2)`);if(M.pass==='waste'&&st.waste>3)why.push(`${st.waste} desperdícios (máximo 3)`)}
 const top=Object.entries(st.mistakes).sort((a,b)=>b[1]-a[1])[0];
 const praise=i===8&&st.falls>0&&ok?`Caiu ${st.falls} ${st.falls===1?'vez':'vezes'} e chegou ao topo mesmo assim!`:i===3&&st.simple?`${st.simple} ${st.simple===1?'saída':'saídas'} pelo caminho simples.`:ok&&left>3?`Meta cumprida com ${Math.round(left)}s de folga.`:st.best>=8?`${st.best} acertos seguidos!`:acc>=.85?`Precisão de ${Math.round(acc*100)}%.`:'Você persistiu até o fim.';
 const crit=top?CRIT[top[0]]:'Busque 3 estrelas: jogue de novo e supere sua marca.';
 const primary=newBiz?`<button class="primary bigplay" id="rcp">★ Ver meus 10 valores</button>`:ok&&i<9?`<button class="primary bigplay" id="next">▶ Nível ${i+2}: ${PILLARS[i+1].t}<small style="display:block;font-size:12px;font-weight:600">começa com treino guiado</small></button>`:!ok?`<button class="primary bigplay" id="again">↻ Tentar de novo</button>`:'';
 view.innerHTML=`<div class="result" style="--pc:${p.c}">
  <div class="bigstars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div class="score">${fmt(score)} pontos</div>
  ${ok?`<div class="won"><div class="t">✓ VALOR ${i+1} DE 10 DO PADRÃO ARA CONQUISTADO</div><div class="p">${p.t}</div><div class="q">“${p.q}”</div><div class="learn"><b>O que você praticou:</b> ${M.learn}</div><div class="vmfinal">${vmeter(i,st,M)}</div></div>`
   :`<div class="retry"><b>Quase lá para conquistar ${p.t}!</b> ${why.join(' e ')}.<br><span class="dim">${LINK[i]}</span><br><div class="vmfinal" style="--pc:${p.c}">${vmeter(i,st,M)}</div></div>`}
  <div class="rprog"><span>Seu Padrão ARA em ${B.game}</span><span class="rdots">${PILLARS.map((q,k)=>`<i class="${passed(b,k)?'on':''} ${k===i?'cur':''}" style="--pc:${q.c}" title="${q.t}">${k+1}</i>`).join('')}</span><b>${doneCount(b)}/10</b></div>
  <div class="racts">${primary}${ok?'<button id="again">↻ Jogar de novo</button>':''}<button class="ghost" id="trl">Trilha</button></div>
  <div class="fbrow"><div class="fbk e"><b>ELOGIO</b>${praise}</div><div class="fbk c"><b>CRÍTICA CONSTRUTIVA · ${p.t.toUpperCase()}</b>${crit}</div></div>
  <div class="posline">${after.all.pos?`Você está em <b>${after.all.pos}º lugar</b> neste computador${before.all&&after.all.pos<before.all?' (subiu!)':''} · `:''}<a href="#" id="rkb" style="color:var(--yellow)">ver ranking</a></div>
  <details class="calc"><summary>Como sua pontuação foi calculada</summary><ul class="breakdown"><li><span>Partida</span><b class="seed">${seed}</b></li><li><span>Acertos / erros</span><b>${st.hits} / ${st.misses}</b></li>
   ${sm.map(e=>`<li><span>${e[0]}</span><b>${e[1]}</b></li>`).join('')}<li><span>Bônus</span><b>+${fmt(st.bonus)}</b></li><li><span>Conta no ranking</span><b>${ok?'sim':'não'}</b></li></ul>
   <p class="dim" style="font-size:13px">${B.social}</p>${localNote()}</details></div>`;
 if(newBiz){sfx.fanfare();confetti(110)}else if(ok){sfx.win();confetti()}else sfx.lose();
 if($('#next'))$('#next').onclick=()=>go(()=>play(b,i+1,{practice:true}));if($('#rcp'))$('#rcp').onclick=()=>go(()=>recap(b,newAll));
 $('#again').onclick=()=>go(()=>play(b,i));$('#trl').onclick=()=>go(()=>trail(b));$('#rkb').onclick=e=>{e.preventDefault();go(()=>rankingView())};
 ($('#rcp')||$('#next')||$('#again')).focus();updHeader();
}
function recap(b,thenFinale){const B=BIZ[b],s=statsOf(P(),b),r=posOf(save.current,b);
 view.innerHTML=`<div class="recap"><p class="eyebrow">${B.name.toUpperCase()} · PADRÃO ARA COMPLETO</p><h1>Parabéns, <span>${esc(P().name)}</span>!</h1>
 <p class="dim" style="font-size:17px">Você praticou os 10 valores em ${B.game}: ${fmt(s.score)} pontos · ${r.pos}º de ${r.total} neste computador.</p>
 <div class="rclist">${PILLARS.map((p,i)=>`<div class="rc" style="--pc:${p.c}"><b>${i+1}. ${p.t}</b><p>${MECH[i].learn}</p></div>`).join('')}</div>
 <div class="racts">${thenFinale?'<button class="primary bigplay" id="fin">★ Conquista final</button>':'<button class="primary bigplay" id="tohub">Próximo negócio</button>'}<button class="ghost" id="brd">Quadro do Padrão</button></div></div>`;
 sfx.fanfare();confetti(90);if($('#fin'))$('#fin').onclick=()=>go(finale);if($('#tohub'))$('#tohub').onclick=()=>go(hub);$('#brd').onclick=()=>go(board)}
function finale(){const pl=P();if(!pl)return go(hub);const s=statsOf(pl),r=posOf(save.current);
 view.innerHTML=`<div class="finale"><div class="trophy">${IC.trophy}</div><p class="eyebrow">PADRÃO ARA COMPLETO · 4 NEGÓCIOS · 40 NÍVEIS</p><h1>Parabéns, <span>${esc(pl.name)}</span>!</h1>
 <p class="dim" style="font-size:17px">Diferentes no que fazem, iguais no jeito de fazer.</p>
 <div class="fstats"><div><b>${r.pos}º</b><small>lugar geral neste computador</small></div><div><b>${fmt(s.score)}</b><small>pontos</small></div><div><b>${s.pillars}/40</b><small>níveis</small></div><div><b>${s.stars}/120</b><small>estrelas</small></div></div>
 <div class="rclist">${PILLARS.map((p,i)=>`<div class="rc" style="--pc:${p.c}"><b>${i+1}. ${p.t}</b><p><i>“${p.q}”</i></p></div>`).join('')}</div>
 ${localNote()}<p style="font-size:18px"><b style="color:var(--yellow)">... em busca da excelência, PRATICAMOS, PRATICAMOS, PRATICAMOS!</b></p>
 <div class="racts"><button class="primary bigplay" id="brd">Quadro do Padrão ARA</button><button class="ghost" id="rk">Ranking</button></div></div>`;
 sfx.fanfare();confetti(140);$('#brd').onclick=()=>go(board);$('#rk').onclick=()=>go(()=>rankingView())}

/* ===== Cabeçalho e menu ===== */
const menu=$('#menuDlg');
function syncMenu(){$('#mSoundV').textContent=sound?'ligado':'desligado';$('#mEventV').textContent=save.event?'ligado':'desligado'}
$('#btnHome').onclick=()=>go(hub);$('#btnRank').onclick=()=>go(()=>rankingView());
$('#btnPlayer').onclick=()=>{if(!cur)askName(()=>go(hub))};
$('#btnMenu').onclick=()=>{syncMenu();menu.showModal()};$('#mClose').onclick=()=>menu.close();
$('#mBoard').onclick=()=>{menu.close();go(board)};$('#mAbout').onclick=()=>{menu.close();go(about)};
$('#mSound').onclick=()=>{sound=!sound;syncMenu()};$('#mEvent').onclick=()=>{save.event=!save.event;persist();syncMenu()};
$('#mFull').onclick=async()=>{menu.close();try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){}};
$('#mPlayer').onclick=()=>{menu.close();askName(()=>go(hub))};
persist();go(hub);
</script></body></html>
